name: Verify Polybrutus D14 exact certificate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact symbolic math dependency
        run: python -m pip install sympy==1.14.0
      - name: Primary D14 exact labelled metric, Gram and spectrum
        run: python src/verify_d14.py
      - name: Independent D14 rational metric and spectral verification
        run: python tests/independent_d14.py
